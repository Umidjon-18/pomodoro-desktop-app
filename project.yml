name: Pomodoro
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  projectFormat: xcode15_3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Pomodoro:
    type: application
    platform: macOS
    sources:
      - path: Pomodoro
        excludes:
          - "Resources/*.sh"
          - "Resources/pomodoro-hosts"
      - path: Pomodoro/Resources/pomodoro-hosts
        buildPhase: resources
      - path: Pomodoro/Resources/install-helper.sh
        buildPhase: resources
      - path: Pomodoro/Resources/uninstall-helper.sh
        buildPhase: resources
    info:
      path: Pomodoro/Info.plist
      properties:
        CFBundleName: Pomodoro
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, uz]
        CFBundleDisplayName: Pomodoro
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Pomodoro closes browser tabs that show a blocked website during a focus session.
    entitlements:
      path: Pomodoro/Pomodoro.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Needed under the hardened runtime to ask for and send Apple Events (closing blocked browser tabs).
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.Pomodoro
        PRODUCT_NAME: Pomodoro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PomodoroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PomodoroTests
    dependencies:
      - target: Pomodoro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.PomodoroTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pomodoro:
    build:
      targets:
        Pomodoro: all
        PomodoroTests: [test]
    test:
      targets:
        - PomodoroTests
    run:
      config: Debug
